<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const startButton =
    document.getElementById("startButton");

const predictButton =
    document.getElementById("predictButton");

const result =
    document.getElementById("result");

const classe =
    document.getElementById("classe");

const confiance =
    document.getElementById("confiance");

const poubelle =
    document.getElementById("poubelle");

const message =
    document.getElementById("message");


let stream = null;


// ======================================================
// Désactiver analyse au démarrage
// ======================================================

predictButton.disabled = true;


// ======================================================
// Activer la webcam
// ======================================================

startButton.addEventListener(
    "click",
    async function () {

        try {

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                message.textContent =
                    "❌ Votre navigateur ne permet pas l'accès à la webcam.";

                return;
            }


            message.textContent =
                "📷 Demande d'accès à la webcam...";


            // Si une ancienne caméra existe
            if (stream) {

                stream.getTracks().forEach(
                    track => track.stop()
                );

            }


            // Demande caméra

            stream =
                await navigator.mediaDevices.getUserMedia({

                    video: {

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        facingMode: "user"

                    },

                    audio: false

                });


            console.log(
                "Webcam obtenue :",
                stream
            );


            // Connecter caméra

            video.srcObject =
                stream;


            video.autoplay =
                true;

            video.playsInline =
                true;


            await video.play();


            message.textContent =
                "✅ Webcam activée. Présentez un déchet devant la caméra.";


            predictButton.disabled =
                false;

        }


        catch (error) {

            console.error(
                "ERREUR WEBCAM :",
                error
            );


            if (
                error.name === "NotAllowedError"
            ) {

                message.textContent =
                    "❌ Accès à la webcam refusé.";

            }

            else if (
                error.name === "NotFoundError"
            ) {

                message.textContent =
                    "❌ Aucune webcam détectée.";

            }

            else if (
                error.name === "NotReadableError"
            ) {

                message.textContent =
                    "❌ La webcam est déjà utilisée.";

            }

            else {

                message.textContent =
                    "❌ Erreur webcam : "
                    + error.name
                    + " — "
                    + error.message;

            }

        }

    }
);


// ======================================================
// Analyse
// ======================================================

predictButton.addEventListener(
    "click",
    async function () {


        if (!stream) {

            message.textContent =
                "❌ Veuillez d'abord activer la webcam.";

            return;
        }


        if (
            video.videoWidth === 0 ||
            video.videoHeight === 0
        ) {

            message.textContent =
                "❌ La caméra n'est pas encore prête.";

            return;
        }


        // Désactiver pendant l'analyse

        predictButton.disabled =
            true;


        message.textContent =
            "🔍 Analyse en cours...";


        try {

            // ==================================================
            // Capturer l'image
            // ==================================================

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const context =
                canvas.getContext("2d");


            context.drawImage(

                video,

                0,
                0,

                canvas.width,
                canvas.height

            );


            // ==================================================
            // Convertir en JPEG
            // ==================================================

            const blob =
                await new Promise(
                    function(resolve) {

                        canvas.toBlob(

                            resolve,

                            "image/jpeg",

                            0.75

                        );

                    }
                );


            if (!blob) {

                throw new Error(
                    "Impossible de créer l'image."
                );

            }


            console.log(
                "Image capturée :",
                blob.size,
                "octets"
            );


            // ==================================================
            // FormData
            // ==================================================

            const formData =
                new FormData();


            formData.append(

                "image",

                blob,

                "webcam.jpg"

            );


            // ==================================================
            // Envoi au serveur
            // ==================================================

            console.log(
                "Envoi de l'image au serveur..."
            );


            const response =
                await fetch(

                    "/predict",

                    {

                        method: "POST",

                        body: formData

                    }

                );


            console.log(
                "Status HTTP :",
                response.status
            );


            // ==================================================
            // Lire la réponse
            // ==================================================

            const texte =
                await response.text();


            console.log(
                "Réponse serveur :",
                texte
            );


            // ==================================================
            // Erreur HTTP
            // ==================================================

            if (!response.ok) {

                if (
                    response.status === 502
                ) {

                    throw new Error(
                        "Le serveur Render a interrompu la requête. " +
                        "La prédiction TensorFlow est probablement trop longue."
                    );

                }


                if (
                    response.status === 500
                ) {

                    throw new Error(
                        "Erreur interne du serveur."
                    );

                }


                throw new Error(

                    "Erreur serveur HTTP "
                    + response.status

                );

            }


            // ==================================================
            // Vérifier réponse vide
            // ==================================================

            if (
                !texte ||
                texte.trim() === ""
            ) {

                throw new Error(
                    "Le serveur a retourné une réponse vide."
                );

            }


            // ==================================================
            // JSON
            // ==================================================

            let data;


            try {

                data =
                    JSON.parse(texte);

            }

            catch (jsonError) {

                console.error(
                    "Réponse non JSON :",
                    texte
                );

                throw new Error(
                    "Le serveur a retourné une réponse invalide."
                );

            }


            // ==================================================
            // Erreur Flask
            // ==================================================

            if (!data.success) {

                throw new Error(

                    data.message ||
                    "Erreur pendant la prédiction."

                );

            }


            // ==================================================
            // Afficher résultat
            // ==================================================

            result.style.display =
                "block";


            classe.textContent =
                data.classe
                    ? data.classe.toUpperCase()
                    : "INCONNU";


            confiance.textContent =
                "Confiance : "
                + data.confiance
                + " %";


            poubelle.textContent =
                data.poubelle ||
                "Aucune recommandation";


            // ==================================================
            // Prédiction fiable
            // ==================================================

            if (data.certain) {

                message.textContent =
                    "✅ Déchet identifié avec suffisamment de confiance.";

            }


            // ==================================================
            // Prédiction incertaine
            // ==================================================

            else {

                classe.textContent =
                    "PAS UN DÉCHET RECONNU";


                confiance.textContent =
                    "Confiance insuffisante";


                poubelle.textContent =
                    "⚠️ Présentez un déchet appartenant aux catégories reconnues.";


                message.textContent =
                    "❌ Cet objet ne semble pas être un déchet reconnu.";

            }

        }


        catch (error) {

            console.error(
                "ERREUR ANALYSE :",
                error
            );


            message.textContent =
                "❌ "
                + error.message;

        }


        finally {

            // Réactiver le bouton

            predictButton.disabled =
                false;

        }

    }
);

</script>
